    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        const SUPABASE_URL = "https://nhrtqzwxrhvldmtwdmir.supabase.co"
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ocnRxend4cmh2bGRtdHdkbWlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjUyNzYsImV4cCI6MjA5NTc0MTI3Nn0.KEctPSX1qxX6jMZEWC1Fl0WRNqPp_YMKAnJ2jEz3PzE"

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        async function chargerDetailsProjet() {
            if (!projectId) {
                document.getElementById('loading-state').innerHTML = "<p class='text-red-500'>Aucun identifiant de projet spécifié.</p>";
                return;
            }

            try {
                const { data: projet, error } = await supabase
                    .from('Projets')
                    .select('id, Title, Description, Subtitles, MainImage, CarouselImages')
                    .eq('id', projectId)
                    .single();

                if (error) throw error;

                if (projet) {
                    document.title = `Détails du Projet | ${projet.Title}`;
                    document.getElementById('project-title').textContent = projet.Title;
                    document.getElementById('project-desc').textContent = projet.Description || 'Aucun sous-titre disponible.';
                    
                    document.getElementById('project-details').textContent = projet.Description || 'Aucune description disponible.'; 

                    const fallbackImg = "https://placehold.co/800x400/0f172a/ffffff?text=Projet+de+Design";
                    document.getElementById('project-img').src = projet.MainImage ? projet.MainImage : fallbackImg;
                    document.getElementById('project-img').alt = `Image principale pour ${projet.Title}`;

                    const skillsContainer = document.getElementById('project-skills');
                    const skills = projet.Subtitles ? projet.Subtitles.split(',').map(s => s.trim()) : [];
                    skillsContainer.innerHTML = skills.length > 0 
                        ? skills.map(skill => `<span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-medium">${skill}</span>`).join('')
                        : '<span class="text-gray-400 text-sm">Aucune compétence listée.</span>';

                    if (projet.CarouselImages) {
                        try {
                            const images = typeof projet.CarouselImages === 'string' 
                                ? JSON.parse(projet.CarouselImages) 
                                : projet.CarouselImages;

                            if (Array.isArray(images) && images.length > 0) {
                                const galleryGrid = document.getElementById('project-gallery-grid');
                                galleryGrid.innerHTML = images.map((imgUrl, idx) => `
                                    <img src="${imgUrl}" alt="Image de la galerie ${idx + 1}" class="w-full h-48 object-cover rounded-lg shadow-md hover:scale-[1.02] transition duration-300" onerror="this.style.display='none'" />
                                `).join('');
                                
                                document.getElementById('project-gallery-section').classList.remove('hidden');
                            }
                        } catch (jsonErr) {
                            console.error("Erreur de parsing JSONB pour CarouselImages :", jsonErr);
                        }
                    }

                    document.getElementById('loading-state').classList.add('hidden');
                    document.getElementById('main-content').classList.remove('hidden');
                }

            } catch (err) {
                console.error("Erreur de chargement :", err.message);
                document.getElementById('loading-state').innerHTML = `<p class='text-red-500'>Erreur lors du chargement des données : ${err.message}</p>`;
            }
        }

        chargerDetailsProjet();
    </script>
